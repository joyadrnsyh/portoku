<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Joy</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "dark-bg": "#030303",
              "dark-surface": "#0d0d0d",
              "dark-hover": "#141414",
              "acid-lime": "#d4fd52",
              "acid-hover": "#e2ff80",
              "border-subtle": "rgba(255, 255, 255, 0.08)",
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
            borderRadius: {
              bento: "2rem",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply bg-dark-bg text-white font-sans antialiased;
        }
      }
      @layer components {
        .contact-input {
          @apply w-full bg-white/5 border border-border-subtle rounded-2xl p-4 text-white outline-none focus:border-acid-lime/50 transition-all focus:bg-white/10;
        }
        .dock-item {
          @apply flex flex-col items-center justify-center p-2 rounded-xl transition-all duration-300 min-w-[64px] text-gray-400 hover:bg-white/5 hover:text-white;
        }
        .dock-item.active {
          @apply bg-white/10 text-white;
        }
        .dock-item.active i {
          @apply text-acid-lime;
        }
      }
    </style>
  </head>
  <body class="pb-32">
    <!-- Header -->
    <header class="pt-24 pb-16 px-6 max-w-4xl mx-auto text-center">
      <h1
        class="text-5xl md:text-7xl font-bold tracking-tighter leading-tight mb-6 text-white"
      >
        Get in <span class="text-acid-lime">Touch</span>
      </h1>
      <p
        class="text-xl text-gray-400 font-normal leading-relaxed max-w-xl mx-auto"
      >
        Have a project in mind or just want to say hi? I'm always open to new
        opportunities.
      </p>
    </header>

    <main class="container mx-auto px-6 max-w-2xl mb-24">
      <div
        class="bg-dark-surface border border-border-subtle rounded-[2.5rem] p-8 md:p-12 shadow-2xl relative overflow-hidden group"
      >
        <!-- Decoration Blur -->
        <div
          class="absolute -top-24 -right-24 w-48 h-48 bg-acid-lime opacity-5 blur-[100px] group-hover:opacity-10 transition-opacity duration-700"
        ></div>

        <form
          id="contact-form"
          action="https://formsubmit.co/joyadriansyah@gmail.com"
          method="POST"
          class="flex flex-col gap-6 relative z-10"
        >
          <!-- FormSubmit Configuration -->
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_subject" value="Pesan Baru dari Portofolio!">
          <div class="flex flex-col gap-2">
            <label
              class="text-sm font-bold uppercase tracking-widest text-gray-500 ml-1"
              >Your Name</label
            >
            <input
              type="text"
              name="name"
              placeholder="John Doe"
              required
              class="contact-input"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label
              class="text-sm font-bold uppercase tracking-widest text-gray-500 ml-1"
              >Your Email</label
            >
            <input
              type="email"
              name="email"
              placeholder="john@example.com"
              required
              class="contact-input"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label
              class="text-sm font-bold uppercase tracking-widest text-gray-500 ml-1"
              >Your Message</label
            >
            <textarea
              name="message"
              placeholder="Tell me about your project..."
              required
              rows="5"
              class="contact-input resize-none"
            ></textarea>
          </div>

          <button
            type="submit"
            class="mt-4 bg-acid-lime hover:bg-acid-hover text-black font-bold py-5 rounded-2xl transition-all duration-300 transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-3"
          >
            <span>Send Message</span>
            <i class="fas fa-paper-plane text-sm"></i>
          </button>
        </form>
      </div>

      <!-- Social Links -->
      <div class="mt-16 text-center">
        <p
          class="text-gray-500 font-medium mb-8 uppercase tracking-[4px] text-xs"
        >
          Or feel free to reach out via
        </p>
        <div class="flex justify-center gap-6">
          <a
            href="https://www.linkedin.com/in/joyadriansyah/"
            target="_blank"
            class="w-14 h-14 bg-white/5 border border-border-subtle rounded-2xl flex items-center justify-center text-2xl transition-all hover:bg-acid-lime hover:text-black hover:-translate-y-2"
          >
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a
            href="https://wa.me/6285783482134"
            target="_blank"
            class="w-14 h-14 bg-white/5 border border-border-subtle rounded-2xl flex items-center justify-center text-2xl transition-all hover:bg-acid-lime hover:text-black hover:-translate-y-2"
          >
            <i class="fab fa-whatsapp"></i>
          </a>
          <a
            href="https://www.instagram.com/joyadriansyah_/"
            target="_blank"
            class="w-14 h-14 bg-white/5 border border-border-subtle rounded-2xl flex items-center justify-center text-2xl transition-all hover:bg-acid-lime hover:text-black hover:-translate-y-2"
          >
            <i class="fab fa-instagram"></i>
          </a>
          <a
            href="https://github.com/joyadrnsyh"
            target="_blank"
            class="w-14 h-14 bg-white/5 border border-border-subtle rounded-2xl flex items-center justify-center text-2xl transition-all hover:bg-acid-lime hover:text-black hover:-translate-y-2"
          >
            <i class="fab fa-github"></i>
          </a>
        </div>
      </div>
    </main>

    <!-- Navigation -->
    <nav
      class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-dark-surface/80 backdrop-blur-2xl border border-white/10 p-2 rounded-2xl flex gap-2 z-50 shadow-2xl"
    >
      <a href="index" class="dock-item">
        <i class="fas fa-home text-lg"></i>
        <span class="text-[10px] uppercase font-bold tracking-wider mt-1"
          >Home</span
        >
      </a>
      <a href="projects" class="dock-item">
        <i class="fas fa-folder text-lg"></i>
        <span class="text-[10px] uppercase font-bold tracking-wider mt-1"
          >Projects</span
        >
      </a>
      <a href="contact" class="dock-item active">
        <i class="fas fa-envelope text-lg"></i>
        <span class="text-[10px] uppercase font-bold tracking-wider mt-1"
          >Contact</span
        >
      </a>
    </nav>

    <!-- AJAX Form Handling & Toast Notifications -->
    <script>
      document.getElementById('contact-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const form = e.target;
        const button = form.querySelector('button[type="submit"]');
        const buttonText = button.querySelector('span');
        const buttonIcon = button.querySelector('i');
        
        // Show loading state
        const originalText = buttonText.textContent;
        buttonText.textContent = 'Sending...';
        button.disabled = true;
        buttonIcon.className = 'fas fa-spinner animate-spin text-sm';
        
        try {
          const response = await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: {
              'Accept': 'application/json'
            }
          });
          
          if (response.ok) {
            showToast('Pesan berhasil dikirim!', 'success');
            form.reset();
          } else {
            showToast('Gagal mengirim pesan. Silakan coba lagi.', 'error');
          }
        } catch (error) {
          showToast('Terjadi kesalahan. Silakan coba lagi.', 'error');
        } finally {
          // Restore button state
          buttonText.textContent = originalText;
          button.disabled = false;
          buttonIcon.className = 'fas fa-paper-plane text-sm';
        }
      });

      // Simple premium Toast helper
      function showToast(message, type) {
        // Remove existing toasts first
        const existingToasts = document.querySelectorAll('.toast-notification');
        existingToasts.forEach(t => t.remove());

        const toast = document.createElement('div');
        toast.className = `toast-notification fixed top-6 right-6 z-50 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 border transition-all duration-500 transform translate-y-[-20px] opacity-0 ${
          type === 'success' 
            ? 'bg-green-950/90 border-green-500/30 text-green-400' 
            : 'bg-red-950/90 border-red-500/30 text-red-400'
        }`;
        
        const icon = document.createElement('i');
        icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
        
        const text = document.createElement('span');
        text.className = 'font-bold text-sm';
        text.textContent = message;
        
        toast.appendChild(icon);
        toast.appendChild(text);
        document.body.appendChild(toast);
        
        // Trigger transition
        setTimeout(() => {
          toast.classList.remove('translate-y-[-20px]', 'opacity-0');
        }, 100);
        
        // Hide and remove after 4 seconds
        setTimeout(() => {
          toast.classList.add('translate-y-[-20px]', 'opacity-0');
          setTimeout(() => {
            toast.remove();
          }, 500);
        }, 4000);
      }
    </script>
  </body>
</html>
