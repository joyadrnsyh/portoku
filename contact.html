<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Joy</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "neo-bg": "#f4f4f0",
              "neo-yellow": "#ffe600",
              "neo-pink": "#ff90e8",
              "neo-cyan": "#23f0ff",
              "neo-green": "#00e59b",
              "neo-orange": "#ff6b00",
              "neo-purple": "#b28dff",
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
            boxShadow: {
              'neo': '8px 8px 0px 0px rgba(0,0,0,1)',
              'neo-sm': '4px 4px 0px 0px rgba(0,0,0,1)',
              'neo-hover': '2px 2px 0px 0px rgba(0,0,0,1)',
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply bg-neo-bg text-black font-sans antialiased selection:bg-neo-yellow selection:text-black;
        }
      }
      @layer components {
        .contact-input {
          @apply w-full bg-white border-4 border-black rounded-xl p-4 text-black font-bold outline-none focus:bg-neo-pink transition-colors shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] focus:translate-x-1 focus:translate-y-1;
        }
        .neo-dock-item {
          @apply flex flex-col items-center justify-center p-2 rounded-xl transition-all duration-200 min-w-[64px] text-black font-bold border-2 border-transparent hover:border-black hover:bg-neo-pink hover:shadow-neo-sm;
        }
        .neo-dock-item.active {
          @apply bg-neo-yellow border-black shadow-neo-sm;
        }
      }
    </style>
  </head>
  <body class="pb-32 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiMwMDAiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')]">
    <!-- Header -->
    <header class="pt-24 pb-16 px-6 max-w-4xl mx-auto text-center">
      <h1
        class="text-6xl md:text-8xl font-extrabold tracking-tighter leading-tight mb-6 uppercase" style="-webkit-text-stroke: 2px black;"
      >
        Get in <span class="text-neo-pink" style="text-shadow: 6px 6px 0px black;">Touch</span>
      </h1>
      <p
        class="text-xl text-black font-bold leading-relaxed max-w-xl mx-auto bg-white border-4 border-black p-4 rounded-xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transform -rotate-1"
      >
        Have a project in mind or just want to say hi? I'm always open to new
        opportunities.
      </p>
    </header>

    <main class="container mx-auto px-6 max-w-2xl mb-24">
      <div
        class="bg-neo-cyan border-8 border-black rounded-3xl p-8 md:p-12 shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] relative overflow-hidden group"
      >
        <form
          id="contact-form"
          action="https://formsubmit.co/joyadriansyah1@gmail.com"
          method="POST"
          class="flex flex-col gap-6 relative z-10"
        >
          <!-- FormSubmit Configuration -->
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_subject" value="Pesan Baru dari Portofolio!">
          <div class="flex flex-col gap-2">
            <label
              class="text-sm font-extrabold uppercase tracking-widest text-black ml-1 bg-white border-2 border-black px-2 py-1 inline-block self-start shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transform -rotate-2"
              >Your Name</label
            >
            <input
              type="text"
              name="name"
              placeholder="John Doe"
              required
              class="contact-input mt-2"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label
              class="text-sm font-extrabold uppercase tracking-widest text-black ml-1 bg-white border-2 border-black px-2 py-1 inline-block self-start shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transform rotate-1"
              >Your Email</label
            >
            <input
              type="email"
              name="email"
              placeholder="john@example.com"
              required
              class="contact-input mt-2"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label
              class="text-sm font-extrabold uppercase tracking-widest text-black ml-1 bg-white border-2 border-black px-2 py-1 inline-block self-start shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transform -rotate-1"
              >Your Message</label
            >
            <textarea
              name="message"
              placeholder="Tell me about your project..."
              required
              rows="5"
              class="contact-input mt-2 resize-none"
            ></textarea>
          </div>

          <button
            type="submit"
            class="mt-6 bg-neo-yellow hover:bg-neo-green text-black font-extrabold text-xl py-5 rounded-2xl border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:translate-y-1 hover:translate-x-1 hover:shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-x-2 active:translate-y-2 transition-all uppercase flex items-center justify-center gap-3"
          >
            <span>Send Message</span>
            <i class="fas fa-paper-plane text-xl"></i>
          </button>
        </form>
      </div>

      <!-- Social Links -->
      <div class="mt-20 text-center">
        <p
          class="text-black bg-white border-4 border-black px-4 py-2 inline-block font-extrabold mb-8 uppercase tracking-[4px] text-xs shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transform rotate-1"
        >
          Or feel free to reach out via
        </p>
        <div class="flex justify-center gap-6">
          <a
            href="https://www.linkedin.com/in/joyadriansyah/"
            target="_blank"
            class="w-16 h-16 bg-white border-4 border-black rounded-xl flex items-center justify-center text-3xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:bg-[#0a66c2] hover:text-white hover:-translate-y-2 hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all"
          >
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a
            href="https://wa.me/6285783482134"
            target="_blank"
            class="w-16 h-16 bg-white border-4 border-black rounded-xl flex items-center justify-center text-3xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:bg-[#25d366] hover:text-white hover:-translate-y-2 hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all"
          >
            <i class="fab fa-whatsapp"></i>
          </a>
          <a
            href="https://www.instagram.com/joyadriansyah_/"
            target="_blank"
            class="w-16 h-16 bg-white border-4 border-black rounded-xl flex items-center justify-center text-3xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:bg-[#e1306c] hover:text-white hover:-translate-y-2 hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all"
          >
            <i class="fab fa-instagram"></i>
          </a>
          <a
            href="https://github.com/joyadrnsyh"
            target="_blank"
            class="w-16 h-16 bg-white border-4 border-black rounded-xl flex items-center justify-center text-3xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:bg-black hover:text-white hover:-translate-y-2 hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all"
          >
            <i class="fab fa-github"></i>
          </a>
        </div>
      </div>
    </main>

    <!-- Navigation -->
    <nav
      class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-white border-4 border-black p-2 rounded-2xl flex gap-2 z-50 shadow-neo"
    >
      <a href="index" class="neo-dock-item">
        <i class="fas fa-home text-xl"></i>
        <span class="text-[10px] uppercase font-bold tracking-wider mt-1"
          >Home</span
        >
      </a>
      <a href="projects" class="neo-dock-item">
        <i class="fas fa-folder text-xl"></i>
        <span class="text-[10px] uppercase font-bold tracking-wider mt-1"
          >Projects</span
        >
      </a>
      <a href="contact" class="neo-dock-item active">
        <i class="fas fa-envelope text-xl"></i>
        <span class="text-[10px] uppercase font-bold tracking-wider mt-1"
          >Contact</span
        >
      </a>
    </nav>

    <!-- AJAX Form Handling & Toast Notifications -->
    <script>
      document.getElementById('contact-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const form = e.target;
        const button = form.querySelector('button[type="submit"]');
        const buttonText = button.querySelector('span');
        const buttonIcon = button.querySelector('i');
        
        // Show loading state
        const originalText = buttonText.textContent;
        buttonText.textContent = 'Sending...';
        button.disabled = true;
        buttonIcon.className = 'fas fa-spinner animate-spin text-xl';
        
        try {
          const response = await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: {
              'Accept': 'application/json'
            }
          });
          
          if (response.ok) {
            showToast('Message sent successfully!', 'success');
            form.reset();
          } else {
            showToast('Failed to send message. Please try again.', 'error');
          }
        } catch (error) {
          showToast('An error occurred. Please try again.', 'error');
        } finally {
          // Restore button state
          buttonText.textContent = originalText;
          button.disabled = false;
          buttonIcon.className = 'fas fa-paper-plane text-xl';
        }
      });

      // Neobrutalist Toast helper
      function showToast(message, type) {
        const existingToasts = document.querySelectorAll('.toast-notification');
        existingToasts.forEach(t => t.remove());

        const toast = document.createElement('div');
        toast.className = `toast-notification fixed top-6 right-6 z-50 px-6 py-4 rounded-xl border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex items-center gap-3 transition-all duration-500 transform translate-y-[-20px] opacity-0 text-black font-bold uppercase ${
          type === 'success' 
            ? 'bg-neo-green' 
            : 'bg-[#ff3b3b]'
        }`;
        
        const icon = document.createElement('i');
        icon.className = type === 'success' ? 'fas fa-check-circle text-2xl' : 'fas fa-exclamation-circle text-2xl';
        
        const text = document.createElement('span');
        text.className = 'font-extrabold text-sm';
        text.textContent = message;
        
        toast.appendChild(icon);
        toast.appendChild(text);
        document.body.appendChild(toast);
        
        setTimeout(() => {
          toast.classList.remove('translate-y-[-20px]', 'opacity-0');
        }, 100);
        
        setTimeout(() => {
          toast.classList.add('translate-y-[-20px]', 'opacity-0');
          setTimeout(() => {
            toast.remove();
          }, 500);
        }, 4000);
      }
    </script>
  </body>
</html>
